name: unit tests

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  app-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --max-workers=1
