name: verify

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify repository structure and localization
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          required = [
              "app/src/main/java/com/example/mylocalai/MainActivity.kt",
              "app/src/main/java/com/example/mylocalai/ui/ChatViewModel.kt",
              "app/src/main/res/values/strings.xml",
              "app/src/main/res/values-he/strings.xml",
              "app/src/main/res/values-ar/strings.xml",
              "app/src/test/java/com/example/mylocalai/LocalizationTest.kt",
              "cli/agent_cli.py",
          ]
          for name in required:
              assert Path(name).is_file(), name
          def keys(p):
              root = ET.parse(p).getroot()
              return {n.attrib["name"] for n in root.findall("string")}
          base = keys("app/src/main/res/values/strings.xml")
          he = keys("app/src/main/res/values-he/strings.xml")
          ar = keys("app/src/main/res/values-ar/strings.xml")
          assert base and base <= he and base <= ar, (base - he, base - ar)
          manifest = Path("app/src/main/AndroidManifest.xml").read_text()
          assert "supportsRtl" in manifest and "true" in manifest
          # Gradle unit tests (34) run locally on the developer machine; this
          # lightweight CI job avoids Android SDK licensing issues on runners.
          print("verify OK:", len(base), "localized keys")
          PY
